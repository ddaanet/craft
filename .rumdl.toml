# Only MD013 with reflow: rumdl is used as a prose wrapper, not a linter.
# Headings, code and tables are not wrapped, so they are not reported either.
# `normalize` re-joins each paragraph before wrapping, so breaks do not depend on
# where an earlier edit happened to leave them. Size caps are bytes, enforced by
# `just check-size`, and need no wrapping.
[global]
enable = ["MD013"]

[MD013]
line-length = 80
reflow = true
reflow-mode = "normalize"
headings = false
code-blocks = false
tables = false
